<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>

    <style>
        .hero-stage {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 34vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #introVideo {
            width: auto;
            max-width: 90%;
            max-height: 34vh;
            height: auto;
        }

        #logoImage {
            display: none;
            width: 90%;
            max-width: 900px;
            height: auto;
            margin: 0 auto;
        }
    </style>
</head>

<body style="background-color:black; text-align:center;">
    
<div class="hero-stage">
    <video
        id="introVideo"
        playsinline
        controls
        > 

        <source src="CBPIntro1.6.mp4" type="video/mp4">

    </video>

    <img
    id="logoImage"
    src="Logofnlblu.png"
    >
</div>
    <script>
        const video = document.getElementById("introVideo");
        const logo = document.getElementById("logoImage");

        video.addEventListener("ended", function () {
            video.style.display = "none";
            logo.style.display = "block";
        });
    </script>

</body>
</html>
