<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .hero-stage {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 32vh;
            display: flex;  
            align-items: flex-start;
            justify-content: center;
        }

        #introVideo {
            width: auto;
            max-width: 100%;
            max-height: 32vh;
            height: auto;
            border-radius: 32px;
            opacity: 0.35;
        }

        #logoImage {
            display: none;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 0 auto;
        }
        .video-wrap {
            position: relative;
            display: inline-block;
            margin-top: 100px;
            border-radius: 16px;
            overflow: hidden;
        }

#playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;

    background: purple;
    color: orange;

    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}
     body {
    margin: 0;
    background-color: black;
    text-align: center;
    
     }   
    .home-section {
        position: relative;
        min-height: 100svh;
        background-color: black;
        background-image: url("Homepagebg.png");
        background-repeat: no-repeat;
        background-position: top center;
        background-size: 100% auto;
        margin-top: -25px;
       } 
     html {
        scroll-behavior: smooth;
}
    .early-access-section {
        position: relative;
        min-height: 100svh;
        height: auto;
        background-color: black;
        background-image: url("early-access-bg.jpg");
        background-repeat: no-repeat;
        background-position: top center;
    background-size: 110% auto;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding-top: 10px;
    padding-bottom: 5px;
}

.early-access-form-wrap {
    width: 96%;
    max-width: 720px;

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(126, 34, 206, 0.35),
        0 0 60px rgba(126, 34, 206, 0.20);
}

/* MailerLite adds its own narrow max-width after this page loads.
   Override that nested wrapper so the form uses the space provided here. */
.early-access-form-wrap > .ml-embedded,
.early-access-form-wrap .ml-form-embedContainer,
.early-access-form-wrap .ml-form-align-center,
.early-access-form-wrap .ml-form-embedWrapper.embedForm {
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box;
}

@media (max-width: 768px) {
    .early-access-section {
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        padding: 0;
        align-items: stretch;
        overflow: hidden;
    }

    .early-access-form-wrap {
        width: 100%;
        max-width: none;
        height: 100svh;
        min-height: 100svh;
        border-radius: 0;
        display: block;
    }

    /* Remove MailerLite's table-cell centering and carry the viewport
       height all the way down to the blue form panel itself. */
    .early-access-form-wrap > .ml-embedded,
    .early-access-form-wrap .ml-form-embedContainer,
    .early-access-form-wrap .ml-form-align-center {
        width: 100% !important;
        max-width: none !important;
        height: 100% !important;
        min-height: 100% !important;
        display: block !important;
        vertical-align: top !important;
    }

    .early-access-form-wrap .ml-form-embedWrapper.embedForm {
        width: 100% !important;
        max-width: none !important;
        height: 100% !important;
        min-height: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        overflow-y: auto;
    }

    .early-access-form-wrap .ml-form-embedHeader {
        flex: 0 0 auto;
    }

    .early-access-form-wrap .ml-form-embedBody.row-form {
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        padding-bottom: 20px !important;
    }

    .early-access-form-wrap .ml-block-form,
    .early-access-form-wrap .ml-form-formContent {
        flex: 1 1 auto;
        min-height: 0;
        display: flex !important;
        flex-direction: column !important;
    }

    .early-access-form-wrap .ml-form-fieldRow.ml-last-item,
    .early-access-form-wrap .ml-field-early_access_interests,
    .early-access-form-wrap .custom-checkbox-radio-list {
        flex: 1 1 auto;
        min-height: 0;
        display: flex !important;
        flex-direction: column !important;
    }

    .early-access-form-wrap .custom-checkbox-radio-list {
        justify-content: space-evenly !important;
    }

    .early-access-form-wrap .ml-form-embedSubmit {
        flex: 0 0 auto;
        margin-top: 12px;
    }
} 
        .ebook-hotspot {
    position: absolute;
    left: 50%;
    top: 70%;
    transform: translate(-50%, -50%);
    width: 78%;
    height: 9%;
    background: rgba(255, 0, 0, 0.35);
    z-index: 20;
        }
.join-party-hotspot {
    position: absolute;

    left: 50%;
    top: 85.5%;
    transform: translate(-50%,-50%);

    width: 78%;
    height: 9%;

    display: block;
    z-index: 20;
    background: transparent;
    
}
.join-party-hotspot,
.join-party-hotspot:hover,
.join-party-hotspot:focus,
.join-party-hotspot:active,
.join-party-hotspot:visited {
    background: transparent !important;
    outline: none;
    box-shadow: none;
    -webkit-tap-highlight-color: transparent;
}

<body>
   <section id="home" class="home-section"> 

       <div class="hero-stage">
    <a href="#early-access" class="join-party-hotspot" aria-label="Join the Party"></a>
    <a href="https://payhip.com/b/A8pxc"
   class="ebook-hotspot"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Get the eBook"></a>
    <div class="video-wrap">

    <video
        id="introVideo"
        playsinline
    >
        <source src="CBPIntro1.6.mp4" type="video/mp4">
    </video>

    <button id="playButton" aria-label="Play Code Block Party manifesto">
        ▶
    </button>

    </div>

</section>
<section id="early-access" class="early-access-section">

    <div class="early-access-form-wrap">
        <div class="ml-embedded" data-form="hkszxT"></div>
    </div>

</section>
    <script>
    const video = document.getElementById("introVideo");
    const playButton = document.getElementById("playButton");

    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        video.play();
    });
        video.addEventListener("timeupdate", function () {
    if(video.duration && video.currentTime >= video.duration - 1) {
        video.pause();
    }
});
    </script>

</body>
