<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>
</head>

<body style="background-color:black; text-align:center; color:white; font-family:Arial;">

    <br><br>

    <video
        id="introVideo"
        width="700"
        autoplay
        muted
        playsinline>

        <source src="Intro.mp4" type="video/mp4">

    </video>

    <img
        id="logoImage"
        src="codeblockparty-logo.jpg"
        width="700"
        style="display:none;">

    <p style="font-size:32px;">
        🚧 Code Block Party is under construction 🚧
    </p>

    <p style="font-size:32px;">
        We are building something for the people.
    </p>

    <p style="font-size:32px;">
        One block at a time.
    </p>

    <script>
        const video = document.getElementById("introVideo");
        const logo = document.getElementById("logoImage");

        video.addEventListener("ended", function () {
            video.style.display = "none";
            logo.style.display = "block";
        });
    </script>

</body>
</html>
