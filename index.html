<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>
</head>

<body style="background-color:black; text-align:center; color:white; font-family:Arial;">

    <br><br>
    
<div class="hero-stage">
    <video
        id="introVideo"
        width="700"
        playsinline
        controls
        > 

        <source src="CBPIntro1.6.mp4" type="video/mp4">

    </video>

    <img
    id="logoImage"
    src="Logofnlblu.png"
    style="
        display:none;
        width:90%;
        max-width:900px;
        height:auto;
        margin:25px auto 0;
    "
    >
</div>
    <script>
        const video = document.getElementById("introVideo");
        const logo = document.getElementById("logoImage");

        video.addEventListener("ended", function () {
            video.style.display = "none";
            logo.style.display = "block";
        });
    </script>

</body>
</html>
