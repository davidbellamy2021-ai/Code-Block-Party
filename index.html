<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .hero-stage {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 32vh;
            display: flex;  
            align-items: flex-start;
            justify-content: center;
        }

        #introVideo {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: 32vh;
            height: auto;
            border-radius: 32px;
            opacity: 0.35;
        }

        #logoImage {
            display: none;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 0 auto;
        }
        .video-wrap {
            position: relative;
            display: inline-block;
            margin-top: 100px;
            border-radius: 16px;
            overflow: hidden;
        }

        /* Keep the video at its current scale, but crop its translucent
           portrait frame before the homepage artwork reaches the city. */
        @media (orientation: portrait) {
            .video-wrap {
                max-height: calc(80vw - 100px);
            }
        }

#playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;

    background: purple;
    color: orange;

    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}
     body {
    margin: 0;
    background-color: black;
    text-align: center;
    
     }   
    .home-section {
        position: relative;
        min-height: 100svh;
        background-color: black;
        background-image: url("Homepagebg.png");
        background-repeat: no-repeat;
        background-position: top center;
        background-size: 100% auto;
        margin-top: -25px;
       } 
     html {
        scroll-behavior: smooth;
}
    .early-access-section {
        position: relative;
        min-height: 100svh;
        height: auto;
        background-color: black;
        background-image: url("early-access-bg.jpg");
        background-repeat: no-repeat;
        background-position: top center;
    background-size: 110% auto;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding-top: 10px;
    padding-bottom: 5px;
}

.early-access-form-wrap {
    width: 96%;
    max-width: 720px;

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(126, 34, 206, 0.35),
        0 0 60px rgba(126, 34, 206, 0.20);
}

/* MailerLite adds its own narrow max-width after this page loads.
   Override that nested wrapper so the form uses the space provided here. */
.early-access-form-wrap > .ml-embedded,
.early-access-form-wrap .ml-form-embedContainer,
.early-access-form-wrap .ml-form-align-center,
.early-access-form-wrap .ml-form-embedWrapper.embedForm {
    width: 100% !important;
    max-width: none !important;
    box-sizing: border-box;
}

@media (max-width: 768px), (orientation: portrait) {
    .early-access-section {
        width: 100%;
        height: 100svh;
        min-height: 100svh;
        padding: 0;
        align-items: stretch;
        overflow: hidden;
    }

    .early-access-form-wrap {
        width: 100%;
        max-width: none;
        height: 100svh;
        min-height: 100svh;
        border-radius: 0;
        display: block;
    }

    /* Remove MailerLite's table-cell centering and carry the viewport
       height all the way down to the blue form panel itself. */
    .early-access-form-wrap > .ml-embedded,
    .early-access-form-wrap .ml-form-embedContainer,
    .early-access-form-wrap .ml-form-align-center {
        width: 100% !important;
        max-width: none !important;
        height: 100% !important;
        min-height: 100% !important;
        display: block !important;
        vertical-align: top !important;
    }

    .early-access-form-wrap .ml-form-embedWrapper.embedForm {
        width: 100% !important;
        max-width: none !important;
        height: 100% !important;
        min-height: 100% !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: flex-start !important;
        overflow-y: auto;
    }

    .early-access-form-wrap .ml-form-embedHeader {
        flex: 0 0 auto;
    }

    .early-access-form-wrap .ml-form-embedBody.row-form {
        flex: 1 1 auto;
        min-height: 0;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        padding-bottom: 20px !important;
    }

    .early-access-form-wrap .ml-block-form,
    .early-access-form-wrap .ml-form-formContent {
        flex: 1 1 auto;
        min-height: 0;
        display: flex !important;
        flex-direction: column !important;
    }

    .early-access-form-wrap .ml-form-fieldRow.ml-last-item,
    .early-access-form-wrap .ml-field-early_access_interests,
    .early-access-form-wrap .custom-checkbox-radio-list {
        flex: 1 1 auto;
        min-height: 0;
        display: flex !important;
        flex-direction: column !important;
    }

    .early-access-form-wrap .custom-checkbox-radio-list {
        justify-content: space-evenly !important;
    }

    .early-access-form-wrap .ml-form-embedSubmit {
        flex: 0 0 auto;
        margin-top: 0;
    }

    /* Scale and distribute the actual form contents with screen height.
       Samsung Browser may report a desktop-width viewport, so svh is the
       reliable measurement for readable, proportional mobile sizing. */
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedBody.row-form {
        display: grid !important;
        grid-template-rows: auto minmax(0, 1fr) !important;
        gap: clamp(18px, 1.7svh, 34px) !important;
        padding: clamp(24px, 2.2svh, 44px)
                 clamp(22px, 3vw, 58px)
                 clamp(26px, 2.5svh, 50px) !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-block-form {
        display: grid !important;
        grid-template-rows: minmax(0, 1fr) auto !important;
        gap: clamp(16px, 1.5svh, 30px) !important;
        min-height: 0 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-formContent {
        display: grid !important;
        grid-template-rows: auto minmax(0, 1fr) !important;
        gap: clamp(14px, 1.25svh, 26px) !important;
        min-height: 0 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-fieldRow.ml-last-item,
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-field-early_access_interests {
        display: block !important;
        height: 100% !important;
        min-height: 0 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-checkbox-radio-list {
        display: grid !important;
        grid-template-rows: repeat(13, minmax(0, 1fr)) !important;
        align-items: stretch !important;
        justify-content: stretch !important;
        height: 100% !important;
        min-height: 0 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-control.custom-checkbox {
        display: flex !important;
        align-items: center !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding-left: clamp(26px, 2.2svh, 42px) !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedContent h4 {
        font-size: clamp(26px, 2.35svh, 44px) !important;
        line-height: 1.12 !important;
        margin-bottom: clamp(12px, 1.1svh, 22px) !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedContent p {
        font-size: clamp(16px, 1.35svh, 26px) !important;
        line-height: 1.35 !important;
        margin-bottom: 0 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-fieldRow input[type="email"] {
        min-height: clamp(48px, 4.8svh, 78px) !important;
        height: clamp(48px, 4.8svh, 78px) !important;
        font-size: clamp(16px, 1.3svh, 25px) !important;
        line-height: 1.2 !important;
        padding: 0 clamp(14px, 1.4svh, 26px) !important;
        box-sizing: border-box !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-control-label {
        font-size: clamp(15px, 1.22svh, 23px) !important;
        line-height: 1.25 !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-control-label::before,
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-control-label::after {
        width: clamp(17px, 1.45svh, 27px) !important;
        height: clamp(17px, 1.45svh, 27px) !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedSubmit button.primary {
        min-height: clamp(52px, 5.2svh, 84px) !important;
        height: clamp(52px, 5.2svh, 84px) !important;
        font-size: clamp(18px, 1.5svh, 28px) !important;
        line-height: 1.15 !important;
        padding: 0 clamp(18px, 1.8svh, 34px) !important;
    }

    /* Keep all 13 interests in distinct, proportional rows.
       An explicit viewport allocation prevents MailerLite's intrinsic
       field height from collapsing the grid. */
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-formContent {
        grid-template-rows: auto 42svh !important;
    }

    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-fieldRow.ml-last-item,
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .ml-field-early_access_interests,
    .early-access-form-wrap .ml-form-embedContainer .ml-form-embedWrapper
    .custom-checkbox-radio-list {
        height: 42svh !important;
        min-height: 42svh !important;
        max-height: none !important;
        overflow: visible !important;
    }

    .early-access-section .early-access-form-wrap
    .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedBody .ml-form-fieldRow
    .custom-control.custom-checkbox {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        box-sizing: border-box !important;
        display: flex !important;
        align-items: center !important;
    }

    .early-access-section .early-access-form-wrap
    .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedBody .ml-form-fieldRow
    .custom-control.custom-checkbox label.custom-control-label {
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        box-sizing: border-box !important;
        display: flex !important;
        align-items: center !important;
        white-space: normal !important;
        font-size: clamp(16px, 1.2svh, 23px) !important;
        line-height: 1.2 !important;
        margin: 0 !important;
    }

    .early-access-section .early-access-form-wrap
    .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedBody .ml-form-fieldRow
    .custom-control.custom-checkbox label.custom-control-label::before,
    .early-access-section .early-access-form-wrap
    .ml-form-embedContainer .ml-form-embedWrapper
    .ml-form-embedBody .ml-form-fieldRow
    .custom-control.custom-checkbox label.custom-control-label::after {
        width: clamp(16px, 1.15svh, 23px) !important;
        height: clamp(16px, 1.15svh, 23px) !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
    }

    /* MailerLite sets checkbox labels through a form-ID rule at 12px.
       Match that ID level and add one more selector so proportional
       label and control sizing wins without editing the embedded form. */
    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
    .custom-checkbox .custom-control-label {
        display: flex !important;
        align-items: center !important;
        width: 100% !important;
        min-height: 0 !important;
        color: #ffffff !important;
        font-size: clamp(18px, 1.35svh, 26px) !important;
        line-height: 1.2 !important;
        white-space: normal !important;
    }

    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
    .custom-checkbox .custom-control-label::before,
    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
    .custom-checkbox .custom-control-label::after {
        width: clamp(20px, 1.4svh, 28px) !important;
        height: clamp(20px, 1.4svh, 28px) !important;
        left: clamp(-34px, -1.8svh, -26px) !important;
        top: 50% !important;
        transform: translateY(-50%) !important;
    }
}

/* Keep the lead-in orange while making the supporting sentence white. */
#early-access [id^="mlb2-"].ml-form-embedContainer
.ml-form-embedWrapper .ml-form-embedBody .ml-form-embedContent p {
    color: #ffffff !important;
}

#early-access [id^="mlb2-"].ml-form-embedContainer
.ml-form-embedWrapper .ml-form-embedBody .ml-form-embedContent p strong {
    color: rgb(242, 140, 40) !important;
}

/* Keep the email and CTA typography proportional in both mobile and
   desktop rendering modes. MailerLite otherwise restores tiny desktop
   font sizes even though the controls themselves remain full-width. */
#early-access [id^="mlb2-"].ml-form-embedContainer
.ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
.ml-field-email input[type="email"] {
    min-height: clamp(48px, 4.8svh, 78px) !important;
    height: clamp(48px, 4.8svh, 78px) !important;
    font-size: clamp(18px, 1.3svh, 25px) !important;
    line-height: 1.2 !important;
    padding: 0 clamp(14px, 1.4svh, 26px) !important;
    box-sizing: border-box !important;
    color: rgb(242, 140, 40) !important;
}

#early-access [id^="mlb2-"].ml-form-embedContainer
.ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
.ml-field-email input[type="email"]::placeholder {
    font-size: inherit !important;
    line-height: inherit !important;
    color: rgb(242, 140, 40) !important;
    opacity: 1 !important;
}

#early-access [id^="mlb2-"].ml-form-embedContainer
.ml-form-embedWrapper .ml-form-embedBody
.ml-form-embedSubmit button.primary {
    min-height: clamp(52px, 5.2svh, 84px) !important;
    height: clamp(52px, 5.2svh, 84px) !important;
    font-size: clamp(18px, 1.5svh, 28px) !important;
    line-height: 1.15 !important;
    padding: 0 clamp(18px, 1.8svh, 34px) !important;
    color: rgb(242, 140, 40) !important;
}

/* A phone can request a desktop-width layout while remaining a touch
   device. Width-based sizing keeps these controls visually identical
   across both browser modes on the same physical screen. */
@media (hover: none) and (pointer: coarse), (max-device-width: 768px) {
    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
    .ml-field-email input[type="email"] {
        min-height: 10vw !important;
        height: 10vw !important;
        font-size: 3.4vw !important;
        line-height: 1.2 !important;
        padding: 0 3vw !important;
    }

    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody .ml-form-fieldRow
    .ml-field-email input[type="email"]::placeholder {
        font-size: 3.4vw !important;
        line-height: 1.2 !important;
    }

    #early-access [id^="mlb2-"].ml-form-embedContainer
    .ml-form-embedWrapper .ml-form-embedBody
    .ml-form-embedSubmit button.primary {
        min-height: 11vw !important;
        height: 11vw !important;
        font-size: 3.4vw !important;
        line-height: 1.15 !important;
        padding: 0 3vw !important;
    }
}

    const video = document.getElementById("introVideo");
    const playButton = document.getElementById("playButton");

    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        video.play();
    });
        video.addEventListener("timeupdate", function () {
