<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>
</head>

<body style="background-color:black; text-align:center; color:white; font-family:Arial;">

    <br><br>

    <video
        id="introVideo"
        width="700"
        autoplay
        muted
        playsinline>

        <source src="CBPIntro.mp4" type="video/mp4">

    </video>

    <img
    id="logoImage"
    src="Logo-final.png"
    style="
        display:none;
        width:700px;
        max-width:100%;
        margin:.5px auto;
    ">

    <p style="font-size:32px;">
        🚧 Code Block Party is under construction 🚧
    </p>
    
    <script>
        const video = document.getElementById("introVideo");
        const logo = document.getElementById("logoImage");

        video.addEventListener("ended", function () {
            video.style.display = "none";
            logo.style.display = "block";
        });
    </script>

</body>
</html>
