<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>

    <style>
        .hero-stage {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 34vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #introVideo {
            width: auto;
            max-width: 100%;
            max-height: 38vh;
            height: auto;
            border-radius: 16px;
        }

        #logoImage {
            display: none;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 0 auto;
        }
        .video-wrap {
    position: relative;
    display: inline-block;
    margin-top: 380px;
    border-radius: 16px;
    overflow: hidden;
}

#playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;

    background: white;
    color: black;

    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}
     body {
    margin: 0;
    background-color: black;
    background-image: url("Cbpwall.jpg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
    text-align: center;
     }   
    </style>
</head>

<body>
    
<div class="hero-stage">
    <div class="video-wrap">

    <video
        id="introVideo"
        playsinline
    >
        <source src="CBPIntro1.6.mp4" type="video/mp4">
    </video>

    <button id="playButton" aria-label="Play Code Block Party manifesto">
        ▶
    </button>

    </div>

    <img
    id="logoImage"
    src="Logofnlblu.png"
    >
</div>
    <script>
    const video = document.getElementById("introVideo");
    const playButton = document.getElementById("playButton");

    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        video.play();
    });
        video.addEventListener("timeupdate", function () {
    if(video.duration && video.currentTime >= video.duration - 1) {
        video.pause();
    }
});
    </script>

</body>
</html>
