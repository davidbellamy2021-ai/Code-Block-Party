<!DOCTYPE html>
<html>
<head>
    <title>Code Block Party</title>

    <style>
        .hero-stage {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 34vh;
            display: flex;  
            align-items: flex-start;
            justify-content: center;
        }

        #introVideo {
            width: auto;
            max-width: 100%;
            max-height: 34vh;
            height: auto;
            border-radius: 32px;
            opacity: 0.4;
        }

        #logoImage {
            display: none;
            width: 100%;
            max-width: 900px;
            height: auto;
            margin: 0 auto;
        }
        .video-wrap {
    position: relative;
    display: inline-block;
    margin-top: 329px;
    border-radius: 16px;
    overflow: hidden;
}

#playButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;

    background: white;
    color: black;

    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}
     body {
    margin: 0;
    background-color: black;
    text-align: center;
    
     }   
    .home-section {
    min-height: 100svh;
    background-color: black;
    background-image: url("Cbpwall.jpg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
       } 
    html {
    scroll-behavior: smooth;
}
.early-access-section {
    min-height: 100vh;
    background-color: black;
    background-image: url("early-access-bg.jpg");
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding-top: 220px;
    padding-bottom: 120px;
}

.early-access-form-wrap {
    width: 90%;
    max-width: 600px;

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(126, 34, 206, 0.35),
        0 0 60px rgba(126, 34, 206, 0.20);
}
.early-access-hotspot {
    position: absolute;
    top: 300px;
    right: 70px;
    width: 120px;
    height: 40px;
    z-index: 5;
        }
    </style>
</head>

<body>
   <section id="home" class="home-section"> 
<div class="hero-stage">
    <a href="#early-access" class="early-access-hotspot" aria-label="Go to Early Access"></a>
    <div class="video-wrap">

    <video
        id="introVideo"
        playsinline
    >
        <source src="CBPIntro1.6.mp4" type="video/mp4">
    </video>

    <button id="playButton" aria-label="Play Code Block Party manifesto">
        ▶
    </button>

    </div>

</section>
<section id="early-access" class="early-access-section">

    <div class="early-access-form-wrap">
        <!-- Your MailerLite embed code will go here -->
    </div>

</section>
    <script>
    const video = document.getElementById("introVideo");
    const playButton = document.getElementById("playButton");

    playButton.addEventListener("click", function () {
        playButton.style.display = "none";
        video.play();
    });
        video.addEventListener("timeupdate", function () {
    if(video.duration && video.currentTime >= video.duration - 1) {
        video.pause();
    }
});
    </script>

</body>
</html>
